[project]
name = "mwcore"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "addict~=2.4.0",
    "colorama~=0.4.6",
    "contourpy~=1.3.0",
    "cycler~=0.12.1",
    "filelock~=3.20.0",
    "filterpy~=1.4.5",
    "fonttools~=4.61.0",
    "fsspec~=2026.1.0",
    "h5py~=3.15.0",
    "jinja2~=3.1.6",
    "joblib~=1.5.3",
    "kiwisolver~=1.4.0",
    "markdown-it-py~=4.0.0",
    "markupsafe~=3.0.3",
    "matplotlib~=3.10.0",
    "mdurl~=0.1.2",
    "mmengine~=0.10.7",
    "mpmath~=1.3.0",
    "networkx~=3.4.0",
    "numpy>=2.0.0",
    "opencv-python~=4.13.0",
    "packaging~=26.0",
    "pillow~=12.1.0",
    "platformdirs~=4.5.1",
    "pygments~=2.19.0",
    "pyopengl~=3.1.10",
    "pyopengl-accelerate~=3.1.10",
    "pyparsing~=3.3.0",
    "pyqtgraph~=0.14.0",
    "pyserial~=3.5",
    "pyside6~=6.8.0",
    "pyside6-addons~=6.8.0",
    "pyside6-essentials~=6.8.0",
    "python-dateutil~=2.9.0",
    "pyyaml~=6.0.3",
    "rich~=14.2.0",
    "scikit-learn~=1.7.0",
    "scipy~=1.15.0",
    "shiboken6~=6.8.0",
    "six~=1.17.0",
    "sympy>=1.11.0",
    "termcolor~=3.3.0",
    "threadpoolctl~=3.6.0",
    "tomli~=2.4.0",
    "tqdm~=4.67.0",
    "typing-extensions~=4.15.0",
    "yapf~=0.43.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.0.0", "torchvision>=0.15.0"]
cu118 = ["torch>=2.0.0", "torchvision>=0.15.0"]
cu121 = ["torch>=2.0.0", "torchvision>=0.15.0"]
cu124 = ["torch>=2.5.0", "torchvision>=0.20.0"]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu118" },
    { extra = "cu121" },
    { extra = "cu124" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu",  extra = "cpu" },
  { index = "pytorch-cu118", extra = "cu118" },
  { index = "pytorch-cu121", extra = "cu121" },
  { index = "pytorch-cu124", extra = "cu124" },
]
torchvision = [
  { index = "pytorch-cpu",  extra = "cpu" },
  { index = "pytorch-cu118", extra = "cu118" },
  { index = "pytorch-cu121", extra = "cu121" },
  { index = "pytorch-cu124", extra = "cu124" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mwcore"]